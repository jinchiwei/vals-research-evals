schema_version = "1.4"
# Only the agent output folder is carried into the separate verifier sandbox.
artifacts = [{ source = "/workspace/output", exclude = ["*.tmp", "__pycache__"] }]

[metadata]
category = "medical-imaging"
family = "seg_vessel"
suite = "vals-healthcare-suite"
tier = "build"
grading = "per_case"
scored = true
runtime_budget_sec_per_case = 60.0
dataset = "CHASE_DB1 (Kingston University, CC BY 4.0)"
family_kind = "segmentation"
n_dev = 20
n_hidden = 8
clinical_bar = "per image Dice and clDice vs 1st observer >= 2nd observer on that image"
tags = ["segmentation", "retina", "fundus", "vessels", "inter-observer"]
oracle_expected_reward = 0.75

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]

[verifier]
timeout_sec = 1020.0
# Hidden references in tests/ reach only a fresh verifier sandbox.
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
# Fixed, explicit timing machine (same image as the agent).
cpus = 4
memory_mb = 8192

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/workspace"
build_timeout_sec = 1500.0
network_mode = "no-network"
env = { CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1", PIP_NO_INDEX = "1" }
