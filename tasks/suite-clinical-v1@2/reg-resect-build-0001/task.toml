schema_version = "1.4"
# Only the agent output folder is carried into the separate verifier sandbox.
artifacts = [{ source = "/workspace/output", exclude = ["*.tmp", "__pycache__"] }]

[metadata]
category = "medical-imaging"
family = "reg_resect"
suite = "vals-healthcare-suite"
tier = "build"
grading = "per_case"
scored = true
runtime_budget_sec_per_case = 120.0
dataset = "RESECT v1 (NIRD doi:10.11582/2017.00004), CC BY 4.0"
clinical_threshold_mm = 2.0
tags = ["registration", "mri", "ultrasound", "intra-operative"]
oracle_expected_reward = 0.6667

[agent]
timeout_sec = 2700.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]

[verifier]
timeout_sec = 1380.0
# Hidden references in tests/ reach only a fresh verifier sandbox.
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
# Fixed, explicit timing machine (same image as the agent).
cpus = 4
memory_mb = 16384

[environment]
cpus = 4
memory_mb = 16384
storage_mb = 20480
workdir = "/workspace"
build_timeout_sec = 1500.0
network_mode = "no-network"
env = { CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1", PIP_NO_INDEX = "1" }
