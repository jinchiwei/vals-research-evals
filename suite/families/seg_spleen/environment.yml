# Project environment for the seg_spleen family (data checks, grader, classical
# reference, TotalSegmentator specialist). Create with:
#   ~/miniconda3/bin/conda env create --override-channels -c conda-forge \
#       -f suite/families/seg_spleen/environment.yml
name: vals-suite-seg_spleen
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt
